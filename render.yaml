services:
  - type: web
    name: carbon-drop-backend
    env: node
    repo: https://github.com/codeverse72/CarbonDrop-Mining.git
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npx tsx server.ts
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_URL
        sync: false

